<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ultimate Bingo Empire{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #000; color: #0f0; margin: 0; padding: 0; }
        .neon { text-shadow: 0 0 10px #0f0, 0 0 20px #0f0; }
        .cyber-grid { background: linear-gradient(#111 1px, transparent 1px), linear-gradient(90deg, #111 1px, transparent 1px); background-size: 20px 20px; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .floating-ball { animation: float 3s ease-in-out infinite; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="cyber-grid">
    {% block content %}{% endblock %}
</body>
</html>
